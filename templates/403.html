{% extends "base.html" %}

{% block title %}Access Denied – SmartWagers{% endblock %}

{% block content %}
<div id="access-denied-overlay">
    <div id="access-denied-modal">
        <div id="access-denied-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                 width="48" height="48">
                <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
                <line x1="12" y1="9" x2="12" y2="13"/>
                <line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
        </div>
        <h2 id="access-denied-title">Access Denied</h2>
        <p id="access-denied-message">
            You do not have permission to view this page.<br>
            Please contact your administrator if you believe this is an error.
        </p>
        <button id="access-denied-back" onclick="history.back()">Go Back</button>
    </div>
</div>

<style>
    #access-denied-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.72);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        animation: fade-in 0.2s ease;
    }

    @keyframes fade-in {
        from { opacity: 0; }
        to   { opacity: 1; }
    }

    #access-denied-modal {
        background: var(--bg-card);
        border: 1px solid rgba(192, 57, 43, 0.45);
        border-radius: var(--radius);
        box-shadow: 0 0 40px rgba(192, 57, 43, 0.25), var(--shadow);
        padding: 40px 48px;
        max-width: 420px;
        width: 90%;
        text-align: center;
        animation: slide-up 0.25s ease;
    }

    @keyframes slide-up {
        from { transform: translateY(18px); opacity: 0; }
        to   { transform: translateY(0);    opacity: 1; }
    }

    #access-denied-icon {
        color: var(--meron);
        margin-bottom: 18px;
        display: flex;
        justify-content: center;
    }

    #access-denied-title {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--meron);
        margin-bottom: 12px;
        letter-spacing: 0.02em;
    }

    #access-denied-message {
        color: var(--text-dim);
        font-size: 0.95rem;
        line-height: 1.6;
        margin-bottom: 28px;
    }

    #access-denied-back {
        background: var(--meron);
        color: #fff;
        border: none;
        border-radius: var(--radius);
        padding: 10px 28px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s ease, transform 0.1s ease;
    }

    #access-denied-back:hover {
        background: var(--meron-dark);
        transform: translateY(-1px);
    }

    #access-denied-back:active {
        transform: translateY(0);
    }
</style>
{% endblock %}
